[project]
name = "church-cms"
version = "0.1.0"
description = "Backend API for a multi-branch church management system"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "psycopg[binary]>=3.3.6",
]

[dependency-groups]
dev = [
    "django-types>=0.24.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["config", "apps"]

[tool.pyright]
include = ["config", "apps"]
exclude = ["**/migrations"]
typeCheckingMode = "standard"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
